<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bugpoop Settings</title>
    <style>
      :root {
        color-scheme: light dark;
        font-family: -apple-system, BlinkMacSystemFont, "Helvetica Neue",
          sans-serif;
      }
      body {
        margin: 0;
        padding: 20px 22px;
        background: #f5f5f7;
        color: #1d1d1f;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.01em;
      }
      .logo {
        display: block;
        width: 112px;
        height: 112px;
        margin: 0 0 16px;
        image-rendering: pixelated;
      }
      .row {
        margin-bottom: 20px;
      }
      .row .label {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 6px;
        font-size: 13px;
      }
      .row .label .value {
        font-variant-numeric: tabular-nums;
        font-weight: 600;
      }
      input[type="range"] {
        width: 100%;
        margin: 0;
      }
      .checkbox {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        cursor: pointer;
      }
      .checkbox input {
        margin: 0;
        width: 16px;
        height: 16px;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #1e1e20;
          color: #f5f5f7;
        }
      }
    </style>
  </head>
  <body>
    <h1>Bugpoop</h1>
    <img class="logo" src="./assets/bug-dropping.png" alt="Bugpoop" />

    <div class="row">
      <div class="label">
        <span>虫のかず (bugs)</span>
        <output class="value" id="bugs-out">1</output>
      </div>
      <input id="bugs" type="range" min="1" max="50" step="1" value="1" />
    </div>

    <div class="row">
      <div class="label">
        <span>空腹スピード (hunger speed)</span>
        <output class="value" id="hunger-out">35</output>
      </div>
      <input id="hunger" type="range" min="0" max="100" step="1" value="35" />
    </div>

    <div class="row">
      <label class="checkbox">
        <input id="reel" type="checkbox" />
        <span>Reel mode（左1/3の縦長ウィンドウ）</span>
      </label>
    </div>

    <script src="./dist/settings.js"></script>
  </body>
</html>
